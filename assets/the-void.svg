<text x="700" y="58" text-anchor="middle" class="title">The Void: Görünürlük ve Yaptırım Boşluğu</text><text x="700" y="88" text-anchor="middle" class="sub">Tek katmanla görülmeyen potansiyel veri çıkış yolları</text>
<rect x="80" y="150" width="330" height="440" rx="10" class="box"/><rect x="80" y="150" width="330" height="64" rx="10" class="blue"/><text x="245" y="190" text-anchor="middle" class="h">Endpoint DLP</text><text x="110" y="260" class="b">Görür</text><text x="110" y="298" class="s">USB, print, clipboard, RDP</text><text x="110" y="345" class="b">Sınırlı / görmez</text><text x="110" y="383" class="s">Eklenti içindeki outbound API</text><text x="110" y="418" class="s">Tarayıcı dışı HTTPS içeriği</text>
<rect x="535" y="132" width="330" height="480" rx="10" class="accent"/><text x="700" y="185" text-anchor="middle" class="title" style="font-size:26px">THE VOID</text><text x="700" y="215" text-anchor="middle" class="sub">Potential egress points</text><text x="580" y="280" class="b">• Unenlightened applications</text><text x="580" y="325" class="b">• Office add-ins and plug-ins</text><text x="580" y="370" class="b">• Desktop API calls</text><text x="580" y="415" class="b">• Unmanaged browser traffic</text><text x="580" y="460" class="b">• Inbound AI responses</text><text x="700" y="535" text-anchor="middle" class="s">Kapsama, trafik ve entegrasyon desteğine bağlıdır.</text>
