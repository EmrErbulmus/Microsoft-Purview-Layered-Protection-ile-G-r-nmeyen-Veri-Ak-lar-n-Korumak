<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="t d"><style>
text{font-family:"Segoe UI",Arial,sans-serif;fill:#243A5E}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#605E5C}.h{font-size:19px;font-weight:700}.b{font-size:15px}.s{font-size:13px;fill:#605E5C}.box{fill:#F3F2F1;stroke:#8A8886;stroke-width:1.5}.blue{fill:#EAF3FC;stroke:#0078D4;stroke-width:2}.accent{fill:#FFF4CE;stroke:#D97706;stroke-width:2}.ok{fill:#107C10;font-weight:700}.partial{fill:#B35A00;font-weight:700}.na{fill:#8A8886}.line{stroke:#605E5C;stroke-width:2;fill:none}.dash{stroke:#D97706;stroke-width:2;stroke-dasharray:7 5;fill:none}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#605E5C"/></marker></defs><title id="t">Microsoft Purview Layered Protection architecture</title><desc id="d">Endpoint, browser and network data security layers with representative control domains.</desc>
<rect width="1400" height="780" fill="#fff"/><text x="700" y="58" text-anchor="middle" class="title">Microsoft Purview Layered Protection</text><text x="700" y="88" text-anchor="middle" class="sub">Farklı veri hareketleri için üç tamamlayıcı yaptırım noktası</text>
<rect x="510" y="120" width="380" height="86" rx="8" class="blue"/><text x="700" y="155" text-anchor="middle" class="h">Ortak sınıflandırma ve politika amacı</text><text x="700" y="181" text-anchor="middle" class="s">SIT • etiket • kapsam • denetim / uyarı / engelleme</text>
<path d="M700 206 V250 M700 250 H230 V285 M700 250 H700 V285 M700 250 H1170 V285" class="line" marker-end="url(#arrow)"/>
<rect x="60" y="285" width="340" height="350" rx="10" class="box"/><rect x="60" y="285" width="340" height="62" rx="10" class="blue"/><text x="230" y="323" text-anchor="middle" class="h">Endpoint DLP</text><text x="90" y="386" class="b">• USB / çıkarılabilir medya</text><text x="90" y="426" class="b">• Yazdırma ve cihaz panosu</text><text x="90" y="466" class="b">• Bluetooth ve RDP kopyalama</text><text x="90" y="506" class="b">• Kısıtlı uygulama grupları</text><text x="90" y="546" class="b">• Çevrimdışı Windows yaptırımı</text><text x="90" y="598" class="s">En güçlü alan: cihaz ve OS düzeyi</text>
<rect x="530" y="285" width="340" height="350" rx="10" class="box"/><rect x="530" y="285" width="340" height="62" rx="10" class="blue"/><text x="700" y="323" text-anchor="middle" class="h">Browser Data Security</text><text x="560" y="386" class="b">• Yönetilen Edge oturumu</text><text x="560" y="426" class="b">• AI istemi ve dosya yükleme</text><text x="560" y="466" class="b">• Yönetilen SaaS uygulamaları</text><text x="560" y="506" class="b">• Oturum içi yükleme / indirme</text><text x="560" y="546" class="b">• BYOD + yönetilen web uygulaması</text><text x="560" y="598" class="s">En güçlü alan: oturum içi hassas kontrol</text>
<rect x="1000" y="285" width="340" height="350" rx="10" class="box"/><rect x="1000" y="285" width="340" height="62" rx="10" class="blue"/><text x="1170" y="323" text-anchor="middle" class="h">Network Data Security</text><text x="1030" y="386" class="b">• Office eklentileri ve API çağrıları</text><text x="1030" y="426" class="b">• Yerel uygulama trafiği</text><text x="1030" y="466" class="b">• Yönetilmeyen tarayıcı trafiği</text><text x="1030" y="506" class="b">• Gelen / giden ağ içeriği</text><text x="1030" y="546" class="b">• GSA veya desteklenen SASE/SSE</text><text x="1030" y="598" class="s">En güçlü alan: HTTP/HTTPS ağ akışı</text>
<rect x="250" y="675" width="900" height="58" rx="8" class="accent"/><text x="700" y="710" text-anchor="middle" class="b">Tek katman tam kapsama sağlamaz; görünürlük ve yaptırım kanal bağlamına göre değişir.</text></svg>