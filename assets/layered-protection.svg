<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><style>
text{font-family:"Segoe UI",Arial,sans-serif;fill:#243A5E}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#605E5C}.h{font-size:19px;font-weight:700}.b{font-size:15px}.s{font-size:13px;fill:#605E5C}.box{fill:#F3F2F1;stroke:#8A8886;stroke-width:1.5}.blue{fill:#EAF3FC;stroke:#0078D4;stroke-width:2}.accent{fill:#FFF4CE;stroke:#D97706;stroke-width:2}.ok{fill:#107C10;font-weight:700}.partial{fill:#B35A00;font-weight:700}.na{fill:#8A8886}.line{stroke:#605E5C;stroke-width:2;fill:none}.dash{stroke:#D97706;stroke-width:2;stroke-dasharray:7 5;fill:none}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#605E5C"/></marker></defs><title id="t">Layered protection flow</title><desc id="d">Sensitive data can move through device, browser and network paths, each protected by a different Purview layer.</desc><rect width="1400" height="760" fill="#fff"/>
<text x="700" y="58" text-anchor="middle" class="title">Katmanlı Veri Koruması</text><text x="700" y="88" text-anchor="middle" class="sub">Aynı veri, farklı yollar, tamamlayıcı kontroller</text>
<rect x="520" y="125" width="360" height="70" rx="8" class="accent"/><text x="700" y="168" text-anchor="middle" class="h">Hassas veri</text>
<path d="M700 195 V240" class="line" marker-end="url(#arrow)"/>
<rect x="140" y="260" width="330" height="250" rx="10" class="box"/><rect x="140" y="260" width="330" height="62" rx="10" class="blue"/><text x="305" y="299" text-anchor="middle" class="h">Endpoint DLP</text><text x="170" y="365" class="b">USB • Print • Clipboard</text><text x="170" y="405" class="b">RDP • Bluetooth • Restricted apps</text><text x="170" y="445" class="b">Offline device enforcement</text><text x="170" y="487" class="s">Cihaz/OS düzeyinde yaptırım</text>
<rect x="535" y="260" width="330" height="250" rx="10" class="box"/><rect x="535" y="260" width="330" height="62" rx="10" class="blue"/><text x="700" y="299" text-anchor="middle" class="h">Browser Data Security</text><text x="565" y="365" class="b">Typed text • File upload</text><text x="565" y="405" class="b">Managed apps • Edge session</text><text x="565" y="445" class="b">In-session controls</text><text x="565" y="487" class="s">Tarayıcı oturumunda inline kontrol</text>
<rect x="930" y="260" width="330" height="250" rx="10" class="box"/><rect x="930" y="260" width="330" height="62" rx="10" class="blue"/><text x="1095" y="299" text-anchor="middle" class="h">Network Data Security</text><text x="960" y="365" class="b">API calls • Add-ins</text><text x="960" y="405" class="b">Native apps • Any browser*</text><text x="960" y="445" class="b">Inbound / outbound content</text><text x="960" y="487" class="s">GSA veya desteklenen SASE/SSE</text>
<path d="M700 510 V565" class="line" marker-end="url(#arrow)"/><path d="M305 510 V540 H700" class="line"/><path d="M1095 510 V540 H700" class="line"/>
<rect x="410" y="585" width="580" height="72" rx="8" class="blue"/><text x="700" y="620" text-anchor="middle" class="h">Birleşik koruma sonucu</text><text x="700" y="644" text-anchor="middle" class="s">Görünürlük + sınıflandırma + kanala uygun yaptırım</text><text x="700" y="710" text-anchor="middle" class="s">* Ağ görünürlüğü trafik yönlendirmesi, ajan ve entegrasyon desteğine bağlıdır.</text></svg>